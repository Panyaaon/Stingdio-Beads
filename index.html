<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STINGDiO Perler Pixel Maker</title>
<style>
:root{
  --pink:#ff5aa5;
  --pink2:#ff77b5;
  --soft:#fff4f9;
  --soft2:#ffe3f0;
  --ink:#111;
  --line:#171717;
  --muted:#666;
  --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
.app{max-width:1480px;margin:0 auto;padding:18px}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px;padding:0 6px}
.logo{font-weight:1000;font-size:clamp(38px,5vw,66px);letter-spacing:-4px;line-height:.9}
.logo .pink{color:var(--pink)}
.subtitle{font-size:clamp(24px,3vw,40px);font-weight:1000;margin-top:4px;letter-spacing:-1.5px}
.tagline{color:#ff7cb5;font-size:clamp(16px,2vw,27px);font-weight:900;line-height:1.05;text-align:right;transform:rotate(-5deg);padding:10px 10px 0 0}

.panel{border:2px solid #f2bfd6;background:#fff;border-radius:24px;padding:16px}
.controlBar{display:grid;grid-template-columns:minmax(260px,1.5fr) 130px 130px 230px;gap:16px;align-items:end}
label{font-weight:950;font-size:17px;display:block;margin-bottom:7px}
input[type=file]{width:100%;border:2px solid #ddd;border-radius:15px;padding:10px;background:#fff;font-size:16px}
.num{width:100%;border:2px solid var(--line);border-radius:13px;padding:10px 12px;font-size:20px}
.rangeWrap{display:flex;align-items:center;gap:10px}
.rangeWrap input{width:100%;accent-color:var(--pink)}
output{font-weight:950}
button{font:inherit;font-weight:1000;cursor:pointer;border-radius:14px;border:2px solid var(--line);padding:14px 18px;letter-spacing:.02em}
button:disabled{opacity:.45;cursor:not-allowed}
.btnPink{background:var(--pink);color:#fff}
.btnBlack{background:#111;color:#fff}
.btnWhite{background:#fff;color:#111}
#autoStatus{grid-column:1 / 5;color:#555;text-align:right;font-weight:800;font-size:15px;margin-top:-4px}

.previews{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.previewCard{border:2px solid #f2bfd6;border-radius:24px;padding:14px;background:#fff}
.cardTitle{font-size:25px;font-weight:1000;display:inline-flex;align-items:center;gap:9px;background:#ffe0ee;padding:6px 14px;border-radius:14px;margin-bottom:10px}
.iconBox{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--pink);color:#fff;font-size:18px}
.stage{width:100%;aspect-ratio:4/3;border:1.5px solid #bbb;border-radius:16px;background:#fbfbfb;display:grid;place-items:center;overflow:hidden}
.stage img,.stage canvas{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
#beforeImage{display:none}
#preview{display:none;image-rendering:pixelated}
.emptyHint{font-weight:900;color:#aaa}

.actionRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin:16px 0}
.actionRow button{font-size:21px;padding:16px}
.actionRow .gear::before{content:"⚙";margin-right:10px}
.actionRow .download::before{content:"⇩";margin-right:10px}

.bottom{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.patternCard{border:2px solid #f2bfd6;border-radius:24px;padding:14px;background:#fff}
.patternHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.patternTitle{font-size:24px;font-weight:1000;display:flex;align-items:center;gap:10px}
.patternSize{font-size:22px;font-weight:1000}
.gridWrap{overflow:auto;border-radius:12px;background:#fff;max-height:860px}
#gridCanvas{display:block;max-width:none;background:#fff}

.paletteCol{display:block}
.paletteCard,.tipCard{border:2px solid #f2bfd6;border-radius:24px;padding:14px;background:#fff}
.paletteTitle{font-size:22px;font-weight:1000}
.paletteCount{font-size:18px;text-align:center;margin:2px 0 10px}
#legendGrid{display:flex;flex-direction:column;gap:7px}
.sw{display:grid;grid-template-columns:46px 1fr 56px;align-items:center;gap:8px;border:1px solid #eee;border-radius:10px;padding:4px 6px;background:#fff}
.chip{height:31px;border-radius:6px;border:1px solid #aaa;display:grid;place-items:center;font-size:0}
.code{font-weight:900;font-size:18px}
.qty{font-weight:800;color:#555;text-align:right}
.tipCard{background:linear-gradient(135deg,#fff0f7,#ffd4e8);font-weight:800;line-height:1.35}
.tipHeart{font-size:26px;color:#e90067}

.hidden{display:none!important}
#sidePreview,#totalStat{display:none}

@media(max-width:900px){
  .app{padding:10px}
  .header{display:block}
  .tagline{display:none}
  .controlBar{grid-template-columns:1fr 1fr}
  .fileField{grid-column:1/3}
  #autoBtn{grid-column:1/3}
  #autoStatus{grid-column:1/3;text-align:center}
  .previews{grid-template-columns:1fr}
  .actionRow{grid-template-columns:1fr 1fr}
  #savePatternBtn{grid-column:1/3}
  .bottom{grid-template-columns:1fr}
  .paletteCol{display:grid;grid-template-columns:1fr}
  #legendGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage{aspect-ratio:auto;min-height:320px}
}
@media(max-width:520px){
  .logo{font-size:38px}
  .subtitle{font-size:23px}
  .panel,.previewCard,.patternCard,.paletteCard,.tipCard{border-radius:18px}
  .controlBar{gap:10px}
  .controlBar label{font-size:14px}
  .num{font-size:18px}
  .previews{gap:12px}
  .stage{min-height:280px}
  .actionRow{position:sticky;bottom:7px;z-index:30;background:rgba(255,255,255,.95);padding:7px;border:2px solid #111;border-radius:18px;gap:8px}
  .actionRow button{font-size:16px;padding:13px 8px}
  #savePatternBtn{grid-column:auto}
  .actionRow{grid-template-columns:1fr 1fr 1fr}
  .patternTitle,.paletteTitle{font-size:19px}
  .patternSize{font-size:18px}
  #legendGrid{grid-template-columns:1fr 1fr}
  .sw{grid-template-columns:34px 1fr 40px}
  .code{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div>
      <div class="logo">STING<span class="pink">DiO</span>♡</div>
      <div class="subtitle">Perler Pixel Maker ✦</div>
    </div>
    <div class="tagline">Turn your favorite<br>images into Perler Beads<br>patterns! ♡ ♡</div>
  </header>

  <section class="panel controlBar">
    <div class="fileField">
      <label>อัปโหลดรูปภาพ</label>
      <input id="file" type="file" accept="image/*">
    </div>
    <div>
      <label>Grid W</label>
      <input id="gw" class="num" type="number" min="8" max="200" value="36">
    </div>
    <div>
      <label>Grid H</label>
      <input id="gh" class="num" type="number" min="8" max="200" value="28">
    </div>
    
    <button id="autoBtn" class="btnPink" disabled>AUTO RESIZE ✦</button>
    <div id="autoStatus">อัปโหลดรูปก่อน แล้วกด Auto Resize เพื่อจับเส้น Grid เดิม</div>
  </section>

  <section class="previews">
    <div class="previewCard">
      <div class="cardTitle"><span class="iconBox">▧</span> BEFORE</div>
      <div class="stage">
        <div id="beforeEmpty" class="emptyHint">อัปโหลดรูปเพื่อเริ่มต้น</div>
        <img id="beforeImage" alt="Original image">
      </div>
    </div>

    <div class="previewCard">
      <div class="cardTitle"><span class="iconBox">▦</span> AFTER</div>
      <div class="stage">
        <div id="afterEmpty" class="emptyHint">กด Generate เพื่อสร้าง Pattern</div>
        <canvas id="preview" width="300" height="300"></canvas>
      </div>
    </div>
  </section>

  <section class="actionRow">
    <button id="genBtn" class="btnPink gear" disabled>GENERATE</button>
    <button id="downloadBtn" class="btnBlack download" disabled>SAVE PIXEL</button>
    <button id="savePatternBtn" class="btnWhite download" disabled>SAVE PATTERN</button>
  </section>

  <section class="bottom">
    <div class="patternCard">
      <div class="patternHead">
        <div class="patternTitle"><span class="iconBox">▥</span> PATTERN GRID</div>
        <div id="sizeStat" class="patternSize">—</div>
      </div>
      <div class="gridWrap">
        <canvas id="gridCanvas" width="900" height="700"></canvas>
      </div>
    </div>

    <aside class="paletteCol">
      <div class="paletteCard">
        <div class="paletteTitle">COLOR PALETTE</div>
        <div class="paletteCount"><b id="colorStat">—</b> colors</div>
        <div id="legendGrid"></div>
      </div>
    </aside>
  </section>

  <div id="totalStat" class="hidden">—</div>
  <canvas id="sidePreview" class="hidden" width="1" height="1"></canvas>
</div>

function srgbToLinear(c){
  c/=255;
  return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
}
function rgbToLab(r,g,b){
  r=srgbToLinear(r); g=srgbToLinear(g); b=srgbToLinear(b);
  let X=(r*0.4124+g*0.3576+b*0.1805)/0.95047;
  let Y=(r*0.2126+g*0.7152+b*0.0722);
  let Z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  X=f(X);Y=f(Y);Z=f(Z);
  return [116*Y-16,500*(X-Y),200*(Y-Z)];
}
for(const p of PALETTE) p.lab=rgbToLab(p.r,p.g,p.b);

function labDistance(a,b){
  const dl=a[0]-b[0], da=a[1]-b[1], db=a[2]-b[2];
  return dl*dl*1.15 + da*da + db*db;
}
function nearestColor(r,g,b){
  const lab=rgbToLab(r,g,b);
  let best=PALETTE[0], bestD=Infinity;
  for(const p of PALETTE){
    const d=labDistance(lab,p.lab);
    if(d<bestD){bestD=d;best=p;}
  }
  return best;
}

function median(arr){
  if(!arr.length) return 255;
  arr.sort((a,b)=>a-b);
  return arr[Math.floor(arr.length/2)];
}
function percentile(arr,q){
  const a=Array.from(arr).sort((x,y)=>x-y);
  return a[Math.min(a.length-1,Math.max(0,Math.floor((a.length-1)*q)))];
}

function axisGrid(gray,w,h,vertical){
  const n=vertical?w:h, other=vertical?h:w;
  const score=new Float64Array(n);
  const a0=Math.floor(other*0.02), a1=Math.ceil(other*0.98);
  for(let i=1;i<n-1;i++){
    let sum=0,c=0;
    for(let j=a0;j<a1;j+=2){
      const v0=vertical?gray[j*w+i-1]:gray[(i-1)*w+j];
      const v1=vertical?gray[j*w+i+1]:gray[(i+1)*w+j];
      sum+=Math.abs(v1-v0); c++;
    }
    score[i]=c?sum/c:0;
  }
  const med=percentile(score,.50);
  const centered=Array.from(score,v=>Math.max(0,v-med));
  let bestLag=0,best=-Infinity;
  const minLag=5, maxLag=Math.min(90,Math.floor(n/6));
  for(let lag=minLag;lag<=maxLag;lag++){
    let sum=0,c=0;
    for(let i=1;i<n-lag;i++){sum+=centered[i]*centered[i+lag];c++;}
    const v=c?sum/c:0;
    if(v>best){best=v;bestLag=lag;}
  }
  if(!bestLag) return null;
  let bestPhase=0,bestPhaseScore=-Infinity;
  for(let ph=0;ph<bestLag;ph++){
    let sum=0,c=0;
    for(let x=ph;x<n;x+=bestLag){
      let local=0;
      for(let d=-2;d<=2;d++) if(x+d>=0&&x+d<n) local=Math.max(local,score[x+d]);
      sum+=local;c++;
    }
    if(c && sum/c>bestPhaseScore){bestPhaseScore=sum/c;bestPhase=ph;}
  }
  const lines=[];
  for(let k=Math.floor((0-bestPhase)/bestLag)-1;k<=Math.ceil((n-bestPhase)/bestLag)+1;k++){
    const expected=bestPhase+k*bestLag;
    if(expected<-3 || expected>n+3) continue;
    let pos=Math.round(expected), strength=-1;
    for(let d=-3;d<=3;d++){
      const x=Math.round(expected+d);
      if(x>=0&&x<n && score[x]>strength){strength=score[x];pos=x;}
    }
    if(pos>=0&&pos<n && (!lines.length || pos-lines[lines.length-1].pos>bestLag*0.45))
      lines.push({pos,strength});
  }
  if(lines.length<9) return null;
  return {spacing:bestLag,score:Array.from(score),lines};
}

function chooseGridWindow(axis,n){
  const L=axis.lines, sp=axis.spacing;
  let best=null;
  for(let i=0;i<L.length-8;i++){
    for(let j=i+8;j<L.length;j++){
      const cells=j-i;
      if(cells>100) break;
      const first=L[i].pos,last=L[j].pos;
      const span=last-first;
      if(Math.abs(span-cells*sp)>sp*1.2) continue;
      let strength=0;
      for(let k=i;k<=j;k++) strength+=L[k].strength;
      strength/=(cells+1);
      const marginPenalty=Math.abs(first-(n-1-last))/Math.max(1,n);
      const score=strength + cells*0.035 - marginPenalty*4;
      if(!best || score>best.score) best={i,j,cells,score};
    }
  }
  return best;
}

function detectGridFromImage(){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const maxDim=1000;
  const scale=Math.min(1,maxDim/Math.max(iw,ih));
  const w=Math.max(40,Math.round(iw*scale)), h=Math.max(40,Math.round(ih*scale));
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=false; ctx.drawImage(img,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h).data;
  const gray=new Float32Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++) gray[j]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  const ax=axisGrid(gray,w,h,true), ay=axisGrid(gray,w,h,false);
  if(!ax||!ay) return null;
  const wx=chooseGridWindow(ax,w), wy=chooseGridWindow(ay,h);
  if(!wx||!wy) return null;
  if(wx.cells<8||wy.cells<8||wx.cells>200||wy.cells>200) return null;
  const inv=1/scale;
  const xLines=ax.lines.slice(wx.i,wx.j+1).map(v=>v.pos*inv);
  const yLines=ay.lines.slice(wy.i,wy.j+1).map(v=>v.pos*inv);
  return {
    cols:wx.cells,rows:wy.cells,xLines,yLines,
    x0:xLines[0],x1:xLines[xLines.length-1],
    y0:yLines[0],y1:yLines[yLines.length-1]
  };
}
function fallbackGrid(){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const long=40;
  return iw>=ih
    ? {cols:long,rows:Math.max(8,Math.round(long*ih/iw))}
    : {rows:long,cols:Math.max(8,Math.round(long*iw/ih))};
}

function makeSourceCanvas(){

function sampleCell(data,w,h,x0,y0,x1,y1){
  const inset=.22;
  let xa=Math.max(0,Math.floor(x0+(x1-x0)*inset));
  let xb=Math.min(w,Math.ceil(x1-(x1-x0)*inset));
  let ya=Math.max(0,Math.floor(y0+(y1-y0)*inset));
  let yb=Math.min(h,Math.ceil(y1-(y1-y0)*inset));
  if(xb<=xa){xa=Math.max(0,Math.floor(x0));xb=Math.min(w,Math.ceil(x1));}
  if(yb<=ya){ya=Math.max(0,Math.floor(y0));yb=Math.min(h,Math.ceil(y1));}
  const buckets=new Map();
  const stepx=Math.max(1,Math.floor((xb-xa)/10));
  const stepy=Math.max(1,Math.floor((yb-ya)/10));
  for(let y=ya;y<yb;y+=stepy){
    for(let x=xa;x<xb;x+=stepx){
      const i=(y*w+x)*4;if(data[i+3]<30)continue;
      const r=data[i],g=data[i+1],b=data[i+2];
      const key=`${Math.round(r/12)},${Math.round(g/12)},${Math.round(b/12)}`;
      let z=buckets.get(key);
      if(!z)z={n:0,rs:[],gs:[],bs:[]};
      z.n++;z.rs.push(r);z.gs.push(g);z.bs.push(b);buckets.set(key,z);
    }
  }
  if(!buckets.size)return {r:255,g:255,b:255,a:0};
  let best=null;
  for(const z of buckets.values())if(!best||z.n>best.n)best=z;
  return {r:median(best.rs),g:median(best.gs),b:median(best.bs),a:255};
}
function getGridBounds(width,height,sw,sh){
  if(autoGrid && autoGrid.cols===width && autoGrid.rows===height &&
     autoGrid.xLines.length===width+1 && autoGrid.yLines.length===height+1)
    return {x:autoGrid.xLines,y:autoGrid.yLines};
  return {
    x:Array.from({length:width+1},(_,i)=>i*sw/width),
    y:Array.from({length:height+1},(_,i)=>i*sh/height)
  };
}
function inferBackground(raw){
  const vals=[],H=raw.length,W=raw[0].length;
  for(let x=0;x<W;x++){vals.push(raw[0][x],raw[H-1][x]);}
  for(let y=1;y<H-1;y++){vals.push(raw[y][0],raw[y][W-1]);}
  return {r:median(vals.map(v=>v.r)),g:median(vals.map(v=>v.g)),b:median(vals.map(v=>v.b))};
}
function sampleToGrid(width,height){
  const src=makeSourceCanvas(),sw=src.width,sh=src.height;
  const data=src.getContext('2d',{willReadFrequently:true}).getImageData(0,0,sw,sh).data;
  const bounds=getGridBounds(width,height,sw,sh);
  const raw=Array.from({length:height},()=>Array(width));
  for(let y=0;y<height;y++)for(let x=0;x<width;x++)
    raw[y][x]=sampleCell(data,sw,sh,bounds.x[x],bounds.y[y],bounds.x[x+1],bounds.y[y+1]);

  const bg=inferBackground(raw),bgLab=rgbToLab(bg.r,bg.g,bg.b);
  const candidate=raw.map(row=>row.map(c=>{
    if(c.a<30)return true;
    return Math.sqrt(labDistance(rgbToLab(c.r,c.g,c.b),bgLab))<10.5;
  }));

  const blank=Array.from({length:height},()=>Array(width).fill(false));
  const q=[];
  function push(x,y){
    if(x<0||y<0||x>=width||y>=height||blank[y][x]||!candidate[y][x])return;
    blank[y][x]=true;q.push([x,y]);
  }
  for(let x=0;x<width;x++){push(x,0);push(x,height-1);}
  for(let y=0;y<height;y++){push(0,y);push(width-1,y);}
  for(let i=0;i<q.length;i++){
    const [x,y]=q[i];push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1);
  }

  const cells=Array.from({length:height},()=>Array(width).fill(null));
  for(let y=0;y<height;y++)for(let x=0;x<width;x++)
    if(!blank[y][x])cells[y][x]=nearestColor(raw[y][x].r,raw[y][x].g,raw[y][x].b);

  const counts=new Map();
  for(const row of cells)for(const p of row)if(p)counts.set(p.code,(counts.get(p.code)||0)+1);
  return {cells,counts,bg};
}
function generate(){
  if(!img)return;
  const W=Math.max(8,Math.min(200,parseInt(gw.value)||36));
  const H=Math.max(8,Math.min(200,parseInt(gh.value)||28));
  const r=sampleToGrid(W,H);
  lastResult={...r,width:W,height:H};
  drawGrid(lastResult);drawPreview(lastResult);renderLegend(lastResult);
  document.getElementById('sizeStat').textContent=`${W}×${H}`;
  document.getElementById('colorStat').textContent=r.counts.size;
  const t=document.getElementById('totalStat');
  if(t)t.textContent=[...r.counts.values()].reduce((a,b)=>a+b,0);
  downloadBtn.disabled=false;savePatternBtn.disabled=false;
}
genBtn.addEventListener('click',generate);

function drawGrid(res){
  const label=30,cell=Math.max(20,Math.min(34,Math.floor(1000/Math.max(res.width,20))));
  const left=label+12,top=label+12;
  gridCanvas.width=left+res.width*cell+12;gridCanvas.height=top+res.height*cell+12;
  const ctx=gridCanvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,gridCanvas.width,gridCanvas.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#111';ctx.font='700 10px system-ui';
  for(let x=0;x<res.width;x++)ctx.fillText(x+1,left+x*cell+cell/2,top-10);
  for(let y=0;y<res.height;y++)ctx.fillText(y+1,left-10,top+y*cell+cell/2);
  for(let y=0;y<res.height;y++)for(let x=0;x<res.width;x++){
    const p=res.cells[y][x],px=left+x*cell,py=top+y*cell;
    ctx.fillStyle=p?`rgb(${p.r},${p.g},${p.b})`:'#fff';ctx.fillRect(px,py,cell,cell);
    ctx.strokeStyle='rgba(17,17,17,.35)';ctx.strokeRect(px+.5,py+.5,cell-1,cell-1);
    if(p){
      ctx.fillStyle=readableText(p.r,p.g,p.b);
      ctx.font=`800 ${Math.max(7,Math.floor(cell*.30))}px ui-monospace,monospace`;
      ctx.fillText(p.code,px+cell/2,py+cell/2);
    }
  }
}
function drawPreview(res){
  const cell=16;
  preview.width=res.width*cell;preview.height=res.height*cell;
  const ctx=preview.getContext('2d');
  ctx.imageSmoothingEnabled=false;ctx.fillStyle='#fff';ctx.fillRect(0,0,preview.width,preview.height);
  for(let y=0;y<res.height;y++)for(let x=0;x<res.width;x++){
    const p=res.cells[y][x],px=x*cell,py=y*cell;
    ctx.fillStyle=p?`rgb(${p.r},${p.g},${p.b})`:'#fff';ctx.fillRect(px,py,cell,cell);
    ctx.strokeStyle='rgba(17,17,17,.25)';ctx.strokeRect(px+.5,py+.5,cell-1,cell-1);
  }
  preview.style.display='block';afterEmpty.style.display='none';
}
function renderLegend(res){
  legendGrid.innerHTML='';
  const used=[...res.counts.entries()]
    .map(([code,count])=>({...PALETTE.find(p=>p.code===code),count}))
    .sort((a,b)=>b.count-a.count||a.code.localeCompare(b.code,undefined,{numeric:true}));
  for(const p of used){
    const div=document.createElement('div');div.className='sw';
    div.innerHTML=`<div class="chip" style="background:rgb(${p.r},${p.g},${p.b})"></div><div class="code">${p.code}</div><div class="qty">${p.count}</div>`;
    legendGrid.appendChild(div);
  }
}
function saveCanvas(canvas,filename){
  canvas.toBlob(blob=>{
    if(!blob){alert('ไม่สามารถสร้างไฟล์ PNG ได้');return;}
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.target='_blank';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1500);
  },'image/png');
}
function downloadPixelPNG(){
  if(!lastResult)return;
  const r=lastResult,cell=28;
  const c=document.createElement('canvas');c.width=r.width*cell;c.height=r.height*cell;
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  for(let y=0;y<r.height;y++)for(let x=0;x<r.width;x++){
    const p=r.cells[y][x],px=x*cell,py=y*cell;
    ctx.fillStyle=p?`rgb(${p.r},${p.g},${p.b})`:'#fff';ctx.fillRect(px,py,cell,cell);
    ctx.strokeStyle='rgba(17,17,17,.25)';ctx.strokeRect(px+.5,py+.5,cell-1,cell-1);
  }
  saveCanvas(c,`stingdio-pixel-${r.width}x${r.height}.png`);
}
function downloadPatternPNG(){
  if(!lastResult)return;
  const r=lastResult,cell=46,label=48,pad=18;
  const c=document.createElement('canvas');
  c.width=pad+label+r.width*cell+pad;c.height=pad+label+r.height*cell+pad;
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  const left=pad+label,top=pad+label;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#111';ctx.font='700 16px system-ui';
  for(let x=0;x<r.width;x++)ctx.fillText(x+1,left+x*cell+cell/2,top-22);
  for(let y=0;y<r.height;y++)ctx.fillText(y+1,left-22,top+y*cell+cell/2);
  for(let y=0;y<r.height;y++)for(let x=0;x<r.width;x++){
    const p=r.cells[y][x],px=left+x*cell,py=top+y*cell;
    ctx.fillStyle=p?`rgb(${p.r},${p.g},${p.b})`:'#fff';ctx.fillRect(px,py,cell,cell);
    ctx.strokeStyle='rgba(17,17,17,.34)';ctx.strokeRect(px+.5,py+.5,cell-1,cell-1);
    if(p){
      ctx.fillStyle=readableText(p.r,p.g,p.b);ctx.font='800 15px ui-monospace,monospace';
      ctx.fillText(p.code,px+cell/2,py+cell/2);
    }
  }
  saveCanvas(c,`stingdio-pattern-${r.width}x${r.height}.png`);
}
downloadBtn.addEventListener('click',downloadPixelPNG);
savePatternBtn.addEventListener('click',downloadPatternPNG);
gw.addEventListener('change',()=>{if(autoGrid&&+gw.value!==autoGrid.cols)autoGrid=null;});
gh.addEventListener('change',()=>{if(autoGrid&&+gh.value!==autoGrid.rows)autoGrid=null;});

</script>
</body>
