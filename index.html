<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STINGDiO Perler Pixel Maker</title>
<style>
  :root {
    --ink:#111111; --muted:#777777; --line:#171717;
    --panel:#ffffff; --bg:#ffffff; --teal:#ff5aa5; --teal2:#ff5aa5;
    --pink:#ff5aa5; --softpink:#fff0f7;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  .app{max-width:1180px;margin:0 auto;padding:18px}
  .brand{font-size:31px;font-weight:950;letter-spacing:-1.8px;margin-bottom:8px}.brand .pink{color:var(--pink)}
  h1{font-weight:950}
  button{font-size:14px;letter-spacing:.02em}
  .previewTitle,.legendHead b{font-weight:950}
  .compareLabel{letter-spacing:.04em}
  .top{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{margin:0;font-size:clamp(24px,4vw,42px);letter-spacing:-.03em}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .panel{background:var(--panel);border:3px solid #171717;border-radius:24px;padding:16px;box-shadow:10px 10px 0 #ffe1ef}
  .controls{display:grid;grid-template-columns:1.3fr .7fr .7fr .7fr;gap:10px;align-items:end}
  .field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:#334155}
  input[type=file]{width:100%;padding:10px;border:3px solid var(--line);border-radius:14px;background:#fff}
  input[type=number],input[type=range]{width:100%}
  input[type=number]{padding:10px;border:3px solid var(--line);border-radius:14px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{appearance:none;border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}
  .primary{background:var(--pink);color:#fff;border:3px solid #111}
  .dark{background:#111;color:#fff;border:3px solid #111}
  .ghost{background:#fff;color:#111;border:3px solid #111}
  button:disabled{opacity:.45;cursor:not-allowed}
  .work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:14px}
  .canvasWrap{overflow:auto;border:3px solid #171717;border-radius:22px;background:white;min-height:420px;display:grid;place-items:center;padding:14px}
  canvas{image-rendering:pixelated;max-width:none;background:#fff}
  .side{display:flex;flex-direction:column;gap:14px}
  .previewBox{background:white;border:3px solid #171717;border-radius:22px;padding:12px}
  .previewTitle{font-weight:900;margin-bottom:8px}
  #preview{width:100%;height:auto;image-rendering:pixelated;border-radius:10px;border:2px solid #111}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:#fff0f7;border:2px solid #111;border-radius:14px;padding:10px}
  .stat b{display:block;font-size:20px}
  .legend{margin-top:14px}
  .legendHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .legendGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-top:10px}
  .sw{border:2px solid #171717;border-radius:12px;overflow:hidden;background:#fff}
  .chip{height:34px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;text-shadow:0 1px 0 rgba(255,255,255,.45)}
  .qty{text-align:center;padding:6px;font-size:12px;font-weight:800}
  .note{font-size:12px;color:var(--muted);line-height:1.45}
  .sliderRow{display:flex;align-items:center;gap:10px}
  .sliderRow output{min-width:42px;text-align:center;font-weight:900}
  .beforeAfter{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:10px}
  .compareCard{min-width:0}
  .compareLabel{text-align:center;font-weight:900;font-size:13px;margin-bottom:8px}
  .compareArrow{font-size:30px;font-weight:900;color:var(--teal2)}
  .imageStage{height:320px;border:3px solid #171717;border-radius:22px;background:#f7f7f7;display:grid;place-items:center;overflow:hidden;position:relative;padding:10px}
  .imageStage img,.imageStage canvas{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;image-rendering:auto}
  .imageStage canvas{image-rendering:pixelated}
  #beforeImage{display:none}
  .emptyHint{color:#94a3b8;text-align:center;font-weight:700;padding:20px}

  @media (max-width:850px){
    .controls{grid-template-columns:1fr 1fr}
    .work{grid-template-columns:1fr}
    .side{display:grid;grid-template-columns:1fr 1fr}
    .beforeAfter{grid-template-columns:1fr}
    .compareArrow{transform:rotate(90deg);text-align:center}

  }
  @media (max-width:560px){
    .controls{grid-template-columns:1fr}
    .side{display:block}
    .previewBox{margin-bottom:12px}
  }

  .compactApp{max-width:720px;margin:0 auto;padding:14px 14px 32px}
  .compactHeader{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 12px}
  .compactHeader .brand{margin:0;font-size:28px}
  .appTitle{font-size:18px;font-weight:950}
  .compactPanel{background:#fff;border:3px solid #111;border-radius:22px;padding:14px;box-shadow:7px 7px 0 #ffe1ef}
  .uploadLabel{display:block;font-size:14px;font-weight:950;margin-bottom:7px}
  .compactPanel input[type=file]{width:100%;font-size:14px;padding:9px;border:3px solid #111;border-radius:13px;background:#fff}
  .compactControls{display:grid;grid-template-columns:90px 90px 1fr;gap:8px;margin-top:10px;align-items:end}
  .miniField label{display:block;font-size:11px;font-weight:900;margin:0 0 4px}
  .miniField input[type=number]{width:100%;padding:8px;border:2px solid #111;border-radius:10px}
  .autoSizeField input{width:100%}
  .fullBtn{width:100%;margin-top:10px;padding:10px}
  .compareCompact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .compactCard{min-width:0}
  .compactLabel{font-size:12px;font-weight:950;text-align:center;margin-bottom:5px}
  .compactStage{height:230px;border:3px solid #111;border-radius:18px;background:#f7f7f7;display:grid;place-items:center;overflow:hidden;padding:8px}
  .compactStage img,.compactStage canvas{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
  .compactStage canvas{image-rendering:pixelated}
  #beforeImage{display:none}
  .actionRow{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin:12px 0}
  .actionBtn{padding:13px 12px;border-radius:14px;font-size:15px}
  .compactDetails{background:#fff;border:2px solid #111;border-radius:16px;margin-top:9px;overflow:hidden}
  .compactDetails summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:950;display:flex;justify-content:space-between;gap:10px}
  .compactDetails summary::-webkit-details-marker{display:none}
  .compactDetails[open] summary{border-bottom:2px solid #111;background:#fff0f7}
  .gridScroller{overflow:auto;padding:8px;max-height:62vh;background:#fff}
  .gridScroller canvas{display:block;max-width:none}
  .compactLegend{padding:10px;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));margin-top:0}
  .autoStatus{margin-top:8px;font-size:12px;font-weight:800;color:#777;text-align:center}.hiddenStats{display:none}
  .emptyHint{font-size:13px;color:#999;font-weight:800;text-align:center}
  @media(max-width:520px){
    .compactApp{padding:10px 10px 24px}
    .compactHeader{display:block}
    .appTitle{font-size:16px;margin-top:2px}
    .compactControls{grid-template-columns:74px 74px 1fr}
    .compactStage{height:185px}
    .actionRow{position:sticky;bottom:8px;z-index:20;background:rgba(255,255,255,.94);padding:7px;border:2px solid #111;border-radius:17px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  }


  /* Full-width Before / After: one preview per row */
  .compareCompact{
    display:flex !important;
    flex-direction:column !important;
    gap:12px !important;
    margin-top:14px;
  }
  .compareCompact .compactCard{width:100%}
  .compareCompact .compactStage{
    width:100%;
    height:min(58vh,430px);
    min-height:300px;
  }
  .compareCompact .compactStage img,
  .compareCompact .compactStage canvas{
    display:block;
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    margin:auto;
  }
  @media(max-width:520px){
    .compareCompact .compactStage{
      height:330px;
      min-height:260px;
    }
  }


  /* AFTER = clean full image, no nested box */
  .compareCompact .compactCard:nth-child(2) .compactStage{
    border:0 !important;
    border-radius:0 !important;
    background:transparent !important;
    padding:0 !important;
    min-height:0 !important;
    height:auto !important;
  }
  .compareCompact .compactCard:nth-child(2) #preview{
    width:100% !important;
    height:auto !important;
    max-width:100% !important;
    max-height:none !important;
    image-rendering:pixelated;
  }
  .compareCompact .compactCard:nth-child(2) #afterEmpty{
    display:none;
  }

</style>
</head>
<body>
<div class="compactApp">
  <header class="compactHeader">
    <div class="brand"><span>STING</span><span class="pink">DiO</span></div>
    <div class="appTitle">Perler Pixel Maker ✦</div>
  </header>

  <section class="compactPanel uploadPanel">
    <label class="uploadLabel">อัปโหลดรูป</label>
    <input id="file" type="file" accept="image/*">

    <div class="compactControls">
      <div class="miniField">
        <label>Grid W</label>
        <input id="gw" type="number" min="8" max="200" value="54">
      </div>
      <div class="miniField">
        <label>Grid H</label>
        <input id="gh" type="number" min="8" max="200" value="54">
      </div>
      <div class="miniField autoSizeField">
        <label>Auto Size <output id="maxOut">54</output></label>
        <input id="maxSize" type="range" min="8" max="100" value="54">
      </div>
    </div>

    <button id="autoBtn" class="ghost fullBtn" disabled>AUTO RESIZE</button>
    <div id="autoStatus" class="autoStatus">ระบบจะพยายามตรวจจับเส้น Grid และจำนวนช่องจากรูปต้นฉบับ</div>
  </section>

  <section class="compareCompact">
    <div class="compactCard">
      <div class="compactLabel">BEFORE</div>
      <div class="compactStage">
        <div id="beforeEmpty" class="emptyHint">รูปต้นฉบับ</div>
        <img id="beforeImage" alt="Original preview">
      </div>
    </div>

    <div class="compactCard">
      <div class="compactLabel">AFTER</div>
      <div class="compactStage">
        <div id="afterEmpty" class="emptyHint"></div>
        <canvas id="preview" width="300" height="300"></canvas>
      </div>
    </div>
  </section>

  <div class="actionRow">
    <button id="genBtn" class="primary actionBtn" title="Clean grid + closest bead palette" disabled>GENERATE</button>
    <button id="downloadBtn" class="dark actionBtn" disabled>SAVE PIXEL</button>
  </div>

  <details class="compactDetails">
    <summary>PATTERN GRID <span id="sizeStat">—</span></summary>
    <div class="gridScroller">
      <canvas id="gridCanvas" width="900" height="700"></canvas>
    </div>
    <div style="padding:8px 10px 10px">
      <button id="savePatternBtn" class="ghost fullBtn" disabled>SAVE PATTERN</button>
    </div>
  </details>

  <details class="compactDetails">
    <summary>COLOR PALETTE <span><b id="colorStat">—</b> colors</span></summary>
    <div id="legendGrid" class="legendGrid compactLegend"></div>
  </details>

  <div class="hiddenStats">
    <span id="totalStat">—</span>
    <canvas id="sidePreview" width="1" height="1"></canvas>
  </div>
</div>

function srgbToLinear(c){
  c/=255;
  return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
}
function rgbToLab(r,g,b){
  r=srgbToLinear(r); g=srgbToLinear(g); b=srgbToLinear(b);
  let X=(r*0.4124+g*0.3576+b*0.1805)/0.95047;
  let Y=(r*0.2126+g*0.7152+b*0.0722)/1.00000;
  let Z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  X=f(X); Y=f(Y); Z=f(Z);
  return [116*Y-16, 500*(X-Y), 200*(Y-Z)];
}
for(const p of PALETTE) p.lab=rgbToLab(p.r,p.g,p.b);

function nearestColor(r,g,b){
  const lab=rgbToLab(r,g,b);
  let best=null,bestD=Infinity;
  for(const p of PALETTE){
    const dl=lab[0]-p.lab[0], da=lab[1]-p.lab[1], db=lab[2]-p.lab[2];
    const d=dl*dl+da*da+db*db;
    if(d<bestD){bestD=d;best=p;}
  }
  return best;
}

function percentile(arr,p){
  const a=[...arr].sort((x,y)=>x-y);
  if(!a.length) return 0;
  const i=Math.max(0,Math.min(a.length-1,Math.round((a.length-1)*p)));
  return a[i];
}

function dominantGridAxis(gray,w,h,vertical){
  const n=vertical?w:h;
  const other=vertical?h:w;
  const score=new Float64Array(n);
  const start=Math.floor(other*0.04), end=Math.ceil(other*0.96);
  for(let i=1;i<n;i++){
    let sum=0,c=0;
    for(let j=start;j<end;j+=2){
      const a=vertical?gray[j*w+i]:gray[i*w+j];
      const b=vertical?gray[j*w+i-1]:gray[(i-1)*w+j];
      sum+=Math.abs(a-b); c++;
    }
    score[i]=c?sum/c:0;
  }
  const base=percentile(score,0.5);
  const hi=percentile(score,0.92);
  const v=Array.from(score,x=>Math.max(0,x-base));
  let bestLag=0,bestCorr=-1;
  const minLag=4, maxLag=Math.min(80,Math.floor(n/5));
  for(let lag=minLag;lag<=maxLag;lag++){
    let s=0,c=0;
    for(let i=1;i<n-lag;i++){ s+=v[i]*v[i+lag]; c++; }
    const corr=c?s/c:0;
    if(corr>bestCorr){bestCorr=corr;bestLag=lag;}
  }
  if(!bestLag) return null;

  let bestPhase=0,bestPhaseScore=-1;
  for(let ph=0;ph<bestLag;ph++){
    let s=0,c=0;
    for(let x=ph;x<n;x+=bestLag){
      let local=0;
      for(let d=-1;d<=1;d++) if(x+d>=0&&x+d<n) local=Math.max(local,score[x+d]);
      s+=local;c++;
    }
    const q=c?s/c:0;
    if(q>bestPhaseScore){bestPhaseScore=q;bestPhase=ph;}
  }

  const peaks=[];
  for(let k=-2;k<Math.ceil(n/bestLag)+2;k++){
    const center=bestPhase+k*bestLag;
    if(center<0||center>=n) continue;
    let bp=center,bs=-1;
    for(let d=-2;d<=2;d++){
      const x=center+d;
      if(x>=0&&x<n&&score[x]>bs){bs=score[x];bp=x;}
    }
    peaks.push({pos:bp,strength:bs});
  }
  const threshold=base+(hi-base)*0.18;
  let best={a:0,b:-1,len:0}, a=0, misses=0;
  for(let i=0;i<peaks.length;i++){
    if(peaks[i].strength<threshold) misses++; else misses=Math.max(0,misses-1);
    while(misses>2 && a<i){ if(peaks[a].strength<threshold) misses--; a++; }
    const len=i-a+1;
    if(len>best.len){best={a,b:i,len};}
  }
  let use=peaks.slice(best.a,best.b+1);
  if(use.length<6) use=peaks;
  const first=use[0]?.pos??0, last=use[use.length-1]?.pos??n-1;
  const count=Math.round((last-first)/bestLag);
  const periodicity=(hi>0)?bestPhaseScore/hi:0;
  return {spacing:bestLag,first,last,count,confidence:periodicity,score:Array.from(score)};
}

function detectGridFromImage(){
  const maxDim=760;
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const scale=Math.min(1,maxDim/Math.max(iw,ih));
  const w=Math.max(32,Math.round(iw*scale)), h=Math.max(32,Math.round(ih*scale));
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;ctx.drawImage(img,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h).data;
  const gray=new Float32Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++) gray[j]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  const ax=dominantGridAxis(gray,w,h,true), ay=dominantGridAxis(gray,w,h,false);
  if(!ax||!ay) return null;
  let cols=ax.count, rows=ay.count;
  if(cols<8||rows<8||cols>200||rows>200) return null;
  if(ax.confidence<0.42||ay.confidence<0.42) return null;
  const inv=1/scale;
  return {
    cols,rows,
    x0:ax.first*inv,y0:ay.first*inv,
    x1:ax.last*inv,y1:ay.last*inv,
    cellW:ax.spacing*inv,cellH:ay.spacing*inv,
    confidence:Math.min(ax.confidence,ay.confidence)
  };
}

function autoResize(){

}

function colorDistanceLab(a,b){
  const dl=a[0]-b[0], da=a[1]-b[1], db=a[2]-b[2];
  return Math.sqrt(dl*dl+da*da+db*db);
}

function median(values){
  if(!values.length) return 255;
  values.sort((a,b)=>a-b);
  const m=Math.floor(values.length/2);
  return values.length%2 ? values[m] : Math.round((values[m-1]+values[m])/2);
}

function estimateBackgroundColor(srcCanvas){
  const ctx=srcCanvas.getContext('2d',{willReadFrequently:true});
  const w=srcCanvas.width,h=srcCanvas.height;
  const data=ctx.getImageData(0,0,w,h).data;
  const rs=[],gs=[],bs=[];
  const edge=Math.max(2,Math.round(Math.min(w,h)*0.025));
  const step=Math.max(1,Math.floor(Math.min(w,h)/180));
  function add(x,y){
    const i=(y*w+x)*4;
    if(data[i+3]<20) return;
    rs.push(data[i]); gs.push(data[i+1]); bs.push(data[i+2]);
  }
  for(let x=0;x<w;x+=step){
    for(let y=0;y<edge;y+=step){ add(x,y); add(x,h-1-y); }
  }
  for(let y=0;y<h;y+=step){
    for(let x=0;x<edge;x+=step){ add(x,y); add(w-1-x,y); }
  }
  return {r:median(rs),g:median(gs),b:median(bs)};
}

function sampleCellMedian(data,sw,sh,x0,y0,x1,y1){
  // Ignore the outer 18% of each region so grid lines / antialias edges
  // do not contaminate the bead color.
  const mx=(x1-x0)*0.18, my=(y1-y0)*0.18;
  let xa=Math.max(0,Math.floor(x0+mx)), xb=Math.min(sw,Math.ceil(x1-mx));
  let ya=Math.max(0,Math.floor(y0+my)), yb=Math.min(sh,Math.ceil(y1-my));
  if(xb<=xa){ xa=Math.max(0,Math.floor(x0)); xb=Math.min(sw,Math.ceil(x1)); }
  if(yb<=ya){ ya=Math.max(0,Math.floor(y0)); yb=Math.min(sh,Math.ceil(y1)); }
  const rs=[],gs=[],bs=[],as=[];
  const stepX=Math.max(1,Math.floor((xb-xa)/7));
  const stepY=Math.max(1,Math.floor((yb-ya)/7));
  for(let y=ya;y<yb;y+=stepY){
    for(let x=xa;x<xb;x+=stepX){
      const i=(y*sw+x)*4;
      as.push(data[i+3]);
      if(data[i+3]>20){ rs.push(data[i]); gs.push(data[i+1]); bs.push(data[i+2]); }
    }
  }
  return {r:median(rs),g:median(gs),b:median(bs),a:median(as)};
}

function sampleToGrid(width,height){
  // Work from the ORIGINAL image resolution. We deliberately do not first
  // shrink it with bilinear smoothing because that creates blended shades.
  const src=document.createElement('canvas');
  src.width=img.naturalWidth||img.width;
  src.height=img.naturalHeight||img.height;
  const sx=src.getContext('2d',{willReadFrequently:true});
  sx.imageSmoothingEnabled=false;
  sx.drawImage(img,0,0,src.width,src.height);
  const d=sx.getImageData(0,0,src.width,src.height).data;
  const bg=estimateBackgroundColor(src);
  const bgLab=rgbToLab(bg.r,bg.g,bg.b);
  const cells=[]; const counts=new Map();

  const useAligned=autoGrid && autoGrid.cols===width && autoGrid.rows===height;
  const gx0=useAligned?autoGrid.x0:0, gy0=useAligned?autoGrid.y0:0;
  const gx1=useAligned?autoGrid.x1:src.width, gy1=useAligned?autoGrid.y1:src.height;
  const cw=(gx1-gx0)/width, ch=(gy1-gy0)/height;
  for(let y=0;y<height;y++){
    const row=[];
    const y0=gy0+y*ch, y1=gy0+(y+1)*ch;
    for(let x=0;x<width;x++){
      const x0=gx0+x*cw, x1=gx0+(x+1)*cw;
      const c=sampleCellMedian(d,src.width,src.height,x0,y0,x1,y1);
      const lab=rgbToLab(c.r,c.g,c.b);
      const bgDist=colorDistanceLab(lab,bgLab);
      const maxc=Math.max(c.r,c.g,c.b), minc=Math.min(c.r,c.g,c.b);
      const sat=maxc===0?0:(maxc-minc)/maxc;
      const light=(c.r+c.g+c.b)/3;

      // Blank cells should stay blank instead of becoming a cream/white bead.
      // The edge-derived background test is robust for screenshots of patterns.
      const isBlank=c.a<30 || bgDist<11 || (light>246 && sat<0.055);
      if(isBlank){ row.push(null); continue; }

      const p=nearestColor(c.r,c.g,c.b);
      row.push(p);
      counts.set(p.code,(counts.get(p.code)||0)+1);
    }
    cells.push(row);
  }
  return {cells,counts,bg};
}
function readableText(r,g,b){
  return (0.299*r+0.587*g+0.114*b)<130?'#fff':'#111';
}

function generate(){
  if(!img) return;
  const Wg=Math.max(8,Math.min(200,+gw.value||54));
  const Hg=Math.max(8,Math.min(200,+gh.value||54));
  const result=sampleToGrid(Wg,Hg);
  lastResult={...result,width:Wg,height:Hg};
  drawGrid(lastResult);
  drawPreview(lastResult);
  renderLegend(lastResult);
  document.getElementById('sizeStat').textContent=`${Wg}×${Hg}`;
  document.getElementById('totalStat').textContent=[...result.counts.values()].reduce((a,b)=>a+b,0).toLocaleString();
  document.getElementById('colorStat').textContent=result.counts.size;
  downloadBtn.disabled=false;
  savePatternBtn.disabled=false;
}
genBtn.addEventListener('click',generate);

function drawGrid(res){
  const label=28;
  const cell=Math.max(18,Math.min(34,Math.floor(900/Math.max(res.width,20))));
  const left=label+12, top=label+12;
  gridCanvas.width=left+res.width*cell+12;
  gridCanvas.height=top+res.height*cell+12;
  const ctx=gridCanvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,gridCanvas.width,gridCanvas.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#111';ctx.font='700 10px system-ui,sans-serif';
  for(let x=0;x<res.width;x++) ctx.fillText(String(x+1),left+x*cell+cell/2,top-9);
  for(let y=0;y<res.height;y++) ctx.fillText(String(y+1),left-9,top+y*cell+cell/2);

  for(let y=0;y<res.height;y++){
    for(let x=0;x<res.width;x++){
      const p=res.cells[y][x];
      const px=left+x*cell, py=top+y*cell;
      ctx.fillStyle=p ? `rgb(${p.r},${p.g},${p.b})` : '#ffffff';
      ctx.fillRect(px,py,cell,cell);
      ctx.strokeStyle='rgba(15,23,42,.24)';
      ctx.lineWidth=1;
      ctx.strokeRect(px+.5,py+.5,cell-1,cell-1);
      if(p && cell>=20){
        ctx.fillStyle=readableText(p.r,p.g,p.b);
        ctx.font=`800 ${Math.max(7,Math.floor(cell*.30))}px ui-monospace,SFMono-Regular,Menlo,monospace`;
        ctx.fillText(p.code,px+cell/2,py+cell/2);
      }
    }
  }
}

function paintPixelPreview(canvas,res){
  const cell=8;
  canvas.width=res.width*cell; canvas.height=res.height*cell;
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  for(let y=0;y<res.height;y++){
    for(let x=0;x<res.width;x++){
      const p=res.cells[y][x];
      ctx.fillStyle=p ? `rgb(${p.r},${p.g},${p.b})` : '#ffffff';
      ctx.fillRect(x*cell,y*cell,cell,cell);
    }
  }
}
function drawPreview(res){
  preview.style.display='block';
  afterEmpty.style.display='none';
  paintPixelPreview(preview,res);
  paintPixelPreview(sidePreview,res);
}

function renderLegend(res){
  legendGrid.innerHTML='';
  const used=[...res.counts.entries()]
    .map(([code,count])=>({...PALETTE.find(p=>p.code===code),count}))
    .sort((a,b)=>b.count-a.count || a.code.localeCompare(b.code,undefined,{numeric:true}));
  for(const p of used){
    const div=document.createElement('div'); div.className='sw';
    div.innerHTML=`<div class="chip" style="background:rgb(${p.r},${p.g},${p.b});color:${readableText(p.r,p.g,p.b)}">${p.code}</div><div class="qty">${p.count.toLocaleString()}</div>`;
    legendGrid.appendChild(div);
  }
}

function downloadPixelPNG(){
  if(!lastResult) return;
  const res=lastResult;
  const scale=24;
  const c=document.createElement('canvas');
  c.width=res.width*scale; c.height=res.height*scale;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  for(let y=0;y<res.height;y++){
    for(let x=0;x<res.width;x++){
      const p=res.cells[y][x];
      ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
      ctx.fillRect(x*scale,y*scale,scale,scale);
    }
  }
  const a=document.createElement('a');
  a.download=`stingdio-pixel-${res.width}x${res.height}.png`;
  a.href=c.toDataURL('image/png');
  a.click();
}

function downloadPatternPNG(){
  if(!lastResult) return;
  const res=lastResult;
  const cell=42, label=42, pad=20;
  const W=pad+label+res.width*cell+pad;
  const H=pad+label+res.height*cell+pad;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const left=pad+label,top=pad+label;
  ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 16px system-ui,sans-serif';
  for(let x=0;x<res.width;x++) ctx.fillText(String(x+1),left+x*cell+cell/2,top-20);
  for(let y=0;y<res.height;y++) ctx.fillText(String(y+1),left-20,top+y*cell+cell/2);
  for(let y=0;y<res.height;y++){
    for(let x=0;x<res.width;x++){
      const p=res.cells[y][x], px=left+x*cell,py=top+y*cell;
      ctx.fillStyle=p ? `rgb(${p.r},${p.g},${p.b})` : '#ffffff';ctx.fillRect(px,py,cell,cell);
      ctx.strokeStyle='rgba(15,23,42,.28)';ctx.strokeRect(px+.5,py+.5,cell-1,cell-1);
      if(p){
        ctx.fillStyle=readableText(p.r,p.g,p.b);
        ctx.font='800 14px ui-monospace,SFMono-Regular,Menlo,monospace';
        ctx.fillText(p.code,px+cell/2,py+cell/2);
      }
    }
  }
  const a=document.createElement('a');
  a.download=`stingdio-pattern-${res.width}x${res.height}.png`;
  a.href=c.toDataURL('image/png');
  a.click();
}
downloadBtn.addEventListener('click',downloadPixelPNG);
savePatternBtn.addEventListener('click',downloadPatternPNG);
</script>
